name: Validate and Modernize Diffeology Archive
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dos2unix
        run: sudo apt-get install -y dos2unix

      - name: Clean and Modernize Source Code
        run: |
          # 1. Fix legacy line endings
          find . -name "*.tex" -exec dos2unix {} +
          
          # 2. Transmute Garamond to Utopia in mathdesign calls
          # This looks for [garamond]{mathdesign} or [...,garamond,...]{mathdesign}
          # and swaps it for utopia.
          find . -name "*.tex" -exec sed -i 's/\[\(.*\)garamond\(.*\)\]{mathdesign}/[\1utopia\2]{mathdesign}/g' {} +
          find . -name "*.tex" -exec sed -i 's/{garamond}{mathdesign}/{utopia}{mathdesign}/g' {} +

      - name: Commit Modernized Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: modernize fonts (Garamond -> Utopia) and fix line endings"
          file_pattern: "*.tex"

      - name: Find and Compile Master Files
        run: |
          MASTERS=$(grep -rl --exclude-dir=Project-Log "\\documentclass" . --include="*.tex" | sed 's|^\./||')
          
          for file in $MASTERS; do
            echo "--------------------------------------------------"
            echo "Compiling: $file"
            echo "--------------------------------------------------"
            
            dir=$(dirname "$file")
            base=$(basename "$file")
            
            # We use pdflatex directly with the buffer size override
            docker run --rm \
              -e buf_size=1000000 \
              -v "$(pwd):/workdir" \
              -w "/workdir/$dir" \
              ghcr.io/xu-cheng/texlive-full \
              /bin/sh -c "pdflatex -interaction=nonstopmode $base && pdflatex -interaction=nonstopmode $base" || \
              (echo "!!! ERROR in $file !!!" && exit 1)
          done

      - name: Quality Report
        run: echo "Archive modernized to Utopia and verified."