name: Validate Diffeology Archive
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean Line Endings (Remove ^^M)
        run: |
          # This finds all .tex files and removes Carriage Returns (\r)
          # ensuring they are in pure Linux/Unix format.
          find . -name "*.tex" -exec sed -i 's/\r//g' {} +

      - name: Find and Compile Master Files
        run: |
          # 1. Find all files with \documentclass
          MASTERS=$(grep -rl "\\documentclass" . --include="*.tex" | sed 's|^\./||')
          
          for file in $MASTERS; do
            echo "--------------------------------------------------"
            echo "Compiling: $file"
            echo "--------------------------------------------------"
            
            # Get the directory and filename
            dir=$(dirname "$file")
            base=$(basename "$file")
            
            # Run the compiler inside the specific folder so it finds local macros
            docker run --rm -v "$(pwd):/workdir" -w "/workdir/$dir" ghcr.io/xu-cheng/texlive-full \
              latexmk -pdf -interaction=nonstopmode "$base"
          done

      - name: Quality Report
        run: echo "All standalone Diffeology sources have been verified and cleaned."