- name: Find and Compile Master Files
  run: |
    MASTERS=$(grep -rl --exclude-dir=Project-Log "\\documentclass" . --include="*.tex" | sed 's|^\./||')
    
    for file in $MASTERS; do
      echo "Compiling: $file"
      dir=$(dirname "$file")
      base=$(basename "$file")
      
      cd "$dir"
      
      # latexmk returns 0 even with warnings, only fails on real errors
      docker run --rm \
        -v "$(pwd):/workdir" \
        -w "/workdir/$dir" \
        ghcr.io/xu-cheng/texlive-full \
        /bin/sh -c "latexmk -pdf -interaction=nonstopmode $base"
      
      if [ $? -eq 0 ] && [ -f "${base%.tex}.pdf" ]; then
        echo "✓ Success: $file"
      else
        echo "!!! FAILED: $file !!!"
        exit 1
      fi
      
      cd -
    done
