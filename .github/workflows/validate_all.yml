name: Validate Diffeology Archive
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Compile Master Files
        run: |
          # This script finds every file with \documentclass and compiles it one by one
          # It handles subfolders and filenames perfectly.
          find . -name "*.tex" -exec grep -l "\\documentclass" {} + | while read -r file; do
            echo "--------------------------------------------------"
            echo "Compiling: $file"
            echo "--------------------------------------------------"
            # We use docker to run the latest TeX Live (MacTeX equivalent)
            docker run --rm -v "$(pwd):/workdir" -w "/workdir" ghcr.io/xu-cheng/texlive-full \
              latexmk -pdf -interaction=nonstopmode "$file"
          done

      - name: Quality Report
        run: echo "All standalone Diffeology sources have been verified."