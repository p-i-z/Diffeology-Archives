name: Validate Diffeology Archive
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean Line Endings (Remove ^^M)
        run: |
          find . -name "*.tex" -exec sed -i 's/\r//g' {} +

      - name: Find and Compile Master Files
        run: |
          # Find all files with \documentclass
          MASTERS=$(grep -rl "\\documentclass" . --include="*.tex" | sed 's|^\./||')
          
          for file in $MASTERS; do
            echo "--------------------------------------------------"
            echo "Compiling: $file"
            echo "--------------------------------------------------"
            
            dir=$(dirname "$file")
            base=$(basename "$file")
            
            # -bibtex-  : Tells latexmk NOT to run bibtex
            # -pdf      : Generates PDF
            # -f        : Force continuation even if there are minor warnings
            docker run --rm -v "$(pwd):/workdir" -w "/workdir/$dir" ghcr.io/xu-cheng/texlive-full \
              latexmk -pdf -bibtex- -f -interaction=nonstopmode "$base"
          done

      - name: Quality Report
        run: echo "All standalone Diffeology sources have been verified."