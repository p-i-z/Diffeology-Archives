name: Validate and Clean Diffeology Archive
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dos2unix
        run: sudo apt-get install -y dos2unix

      - name: Clean Line Endings (Fix legacy Mac/Windows)
        run: |
          find . -name "*.tex" -exec dos2unix {} +

      - name: Commit Cleaned Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: normalize line endings for AI-readiness"
          file_pattern: "*.tex"

      - name: Find and Compile Master Files
        run: |
          # --exclude-dir=Project-Log tells grep to ignore your logs
          MASTERS=$(grep -rl --exclude-dir=Project-Log "\\documentclass" . --include="*.tex" | sed 's|^\./||')
          
          for file in $MASTERS; do
            echo "--------------------------------------------------"
            echo "Compiling: $file"
            echo "--------------------------------------------------"
            
            dir=$(dirname "$file")
            base=$(basename "$file")
            
            docker run --rm \
              -e buf_size=1000000 \
              -v "$(pwd):/workdir" \
              -w "/workdir/$dir" \
              ghcr.io/xu-cheng/texlive-full \
              latexmk -pdf -bibtex- -f -interaction=nonstopmode "$base"
          done

      - name: Quality Report
        run: echo "All standalone Diffeology sources have been verified."