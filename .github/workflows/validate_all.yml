name: Validate Diffeology Archive
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Master Files
        id: find_masters
        run: |
          # 1. Find all .tex files containing \documentclass
          # 2. Remove the './' from the start of the paths
          # 3. Join them into a single line separated by spaces
          MASTERS=$(grep -rl "\\documentclass" . --include="*.tex" | sed 's|^\./||' | xargs)
          
          if [ -z "$MASTERS" ]; then
            echo "No master LaTeX files found."
            exit 1
          fi
          
          echo "Found Master files: $MASTERS"
          echo "masters=$MASTERS" >> $GITHUB_OUTPUT

      - name: Compile Master Documents
        uses: xu-cheng/latex-action@v3
        with:
          # This now correctly receives the list of files from the step above
          root_file: ${{ steps.find_masters.outputs.masters }}
          # This ensures that if one paper has a typo, the others still get tested
          continue_on_error: true
          texlive_version: latest

      - name: Final Quality Report
        run: |
          echo "The validation of the Diffeology Archive is complete."