name: Validate Diffeology Archive
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dos2unix
        run: sudo apt-get install -y dos2unix

      - name: Clean Line Endings Safely
        run: |
          # dos2unix is much safer than sed for converting line endings
          find . -name "*.tex" -exec dos2unix {} +

      - name: Find and Compile Master Files
        run: |
          MASTERS=$(grep -rl "\\documentclass" . --include="*.tex" | sed 's|^\./||')
          
          for file in $MASTERS; do
            echo "--------------------------------------------------"
            echo "Compiling: $file"
            echo "--------------------------------------------------"
            
            dir=$(dirname "$file")
            base=$(basename "$file")
            
            # We modify the texmf.cnf inside the container to increase buf_size to 1,000,000
            docker run --rm -v "$(pwd):/workdir" -w "/workdir/$dir" ghcr.io/xu-cheng/texlive-full \
              /bin/sh -c "sed -i 's/buf_size = .*/buf_size = 1000000/' /usr/local/texlive/2025/texmf-dist/web2c/texmf.cnf && \
              latexmk -pdf -bibtex- -f -interaction=nonstopmode $base"
          done

      - name: Quality Report
        run: echo "All standalone Diffeology sources have been verified."