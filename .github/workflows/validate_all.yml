name: Validate and Clean Diffeology Archive
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    # We need write permissions to save the cleaned files back to the repo
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dos2unix
        run: sudo apt-get install -y dos2unix

      - name: Clean Line Endings Safely
        run: |
          # This fixes the legacy Mac CR and Windows CRLF issues
          find . -name "*.tex" -exec dos2unix {} +

      - name: Commit Cleaned Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: normalize line endings for AI-readiness (remove ^^M)"
          file_pattern: "*.tex"

      - name: Find and Compile Master Files
        run: |
          MASTERS=$(grep -rl "\\documentclass" . --include="*.tex" | sed 's|^\./||')
          for file in $MASTERS; do
            echo "Compiling: $file"
            dir=$(dirname "$file")
            base=$(basename "$file")
            docker run --rm -v "$(pwd):/workdir" -w "/workdir/$dir" ghcr.io/xu-cheng/texlive-full \
              /bin/sh -c "sed -i 's/buf_size = .*/buf_size = 1000000/' /usr/local/texlive/2025/texmf-dist/web2c/texmf.cnf && \
              latexmk -pdf -bibtex- -f -interaction=nonstopmode $base"
          done