- name: Find and Compile Master Files
  run: |
    MASTERS=$(grep -rl --exclude-dir=Project-Log "\\documentclass" . --include="*.tex" | sed 's|^\./||')
    
    for file in $MASTERS; do
      echo "Compiling: $file"
      dir=$(dirname "$file")
      base=$(basename "$file")
      cd "$dir"
      
      # Run three times to resolve all references and outlines
      pdflatex -interaction=nonstopmode "$base" || true
      pdflatex -interaction=nonstopmode "$base" || true
      pdflatex -interaction=nonstopmode "$base" || true
      
      # Check if PDF was actually created
      if [ ! -f "${base%.tex}.pdf" ]; then
        echo "!!! ERROR: PDF not created for $file !!!"
        exit 1
      fi
      cd -
    done
